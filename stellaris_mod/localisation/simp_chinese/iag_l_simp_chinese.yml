l_simp_chinese:
 iag_create_carrier_enclave:0 "创建 LLM 建设载体飞地"
 iag_create_carrier_enclave_desc:0 "生成名为§H灰风§!的首都直连专用星系，以及§H川陀§!和§H端点星§!两颗 25 格盖亚载体殖民地。川陀承载建筑面板，端点星承载主区划与区划特化面板。"
 iag_carrier.1.name:0 "LLM 建设载体：创建飞地"
 iag_carrier.1.desc:0 "该法令会为外部 LLM 执行器创建一个专用建设载体飞地。\n\n飞地会被放置在名为§H灰风§!的专用星系中，并通过一条超空间航道与当前首都星系直接连接。星系内有两颗 25 格盖亚载体殖民地：§H川陀§!专门保持建筑选择面板，§H端点星§!专门保持主区划与区划特化面板。两颗殖民地均不承担资源生产、内政规划或普通殖民地管理任务。非我方舰队进入灰风后仍会受到§H第四面墙§!阻拦。\n\n该 mod 本身不会发包、不会自动点击，也不会执行 LLM 决策；它只负责准备干净、稳定、低干扰的游戏内载体目标。"
 iag_carrier.create:0 "创建载体飞地"
 iag_carrier.create.tt:0 "将在首都附近生成一个名为§H灰风§!的专用星系，以一条超空间航道与首都直接连接，并创建§H川陀§!与§H端点星§!两颗 25 格盖亚载体殖民地。"
 iag_carrier.repair:0 "维护现有载体飞地"
 iag_carrier.repair.tt:0 "维护川陀与端点星的名称和保护；旧存档缺少端点星时会自动补建，并确保灰风与当前首都星系直接连接，同时移除失落帝国圣地标记与圣地修正。"
 iag_carrier.cancel:0 "暂不创建"
 iag_carrier.2.name:0 "LLM 建设载体：飞地已创建"
 iag_carrier.2.desc:0 "专用建设载体飞地已经创建。§H灰风§!已与当前首都星系直接连接；星系中的§H川陀§!与§H端点星§!均已获得住房、舒适度、稳定度、犯罪和维护费保护。\n\n请让川陀保持建筑选择面板，让端点星保持主区划或区划特化面板。外部执行器会按动作类型点击对应载体，再把命令改写为目标行星上的真实建设命令。"
 iag_carrier.ok:0 "确认"
 iag_carrier.10.name:0 "第四面墙"
 iag_carrier.10.desc:0 "我们的船队在试图进入该区域的时候，遇到了一种未知力量的阻拦。\n一堵无形的\"墙\"挡在我们和目标星系之间。\n在尝试了我们目前所掌握的全部技术手段仍未果之后，随行船队的科学家自告奋勇前去近距离观察。\"墙\"似乎对我们的观察做出了回应。它开始进行频闪 似乎是在向我们传递一种信息。经过解密 我们的科学家得到了信息的大致内容。\n\"前面的区域，以后再来探索吧~\""
 iag_carrier.10.a:0 "以后再来探索"
 NAME_IAG_Carrier_Enclave_System:0 "灰风"
 NAME_IAG_Carrier_Enclave:0 "川陀"
 NAME_IAG_Carrier_Zone_Enclave:0 "端点星"
 iag_carrier_enclave_planet:0 "LLM 载体飞地保护"
 iag_carrier_enclave_planet_desc:0 "该殖民地只作为建设命令载体使用，不承担普通经济与内政规划。"
