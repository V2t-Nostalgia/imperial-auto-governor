l_english:
 iag_create_carrier_enclave:0 "Create LLM Construction Carrier Enclave"
 iag_create_carrier_enclave_desc:0 "Spawn the capital-linked §HGrey Wind§! system with two size-25 Gaia carrier colonies: §HTrantor§! for building clicks and §HTerminus§! for primary-district and zone-specialization clicks."
 iag_carrier.1.name:0 "LLM Construction Carrier: Create Enclave"
 iag_carrier.1.desc:0 "This edict creates a dedicated construction carrier enclave for the external LLM executor.\n\nThe §HGrey Wind§! system is connected directly to the current capital by one hyperlane. It contains two size-25 Gaia carrier colonies: §HTrantor§! keeps the building selection panel open, while §HTerminus§! keeps the primary-district or zone-specialization panel open. Neither colony participates in the normal economy or domestic planning. Non-owner fleets entering Grey Wind are still rejected by the §HFourth Wall§! safeguard.\n\nThis mod does not send packets, click the UI, or execute LLM decisions by itself. It only prepares clean in-game carrier targets."
 iag_carrier.create:0 "Create Carrier Enclave"
 iag_carrier.create.tt:0 "Creates a dedicated §HGrey Wind§! system near the capital, links it directly to the capital by one hyperlane, and creates two size-25 Gaia carrier colonies named §HTrantor§! and §HTerminus§!."
 iag_carrier.repair:0 "Maintain Existing Carrier Enclave"
 iag_carrier.repair.tt:0 "Maintains Trantor and Terminus, creates a missing Terminus in old saves, links Grey Wind directly to the current capital, and removes Fallen Empire holy-world markers and modifiers."
 iag_carrier.cancel:0 "Do not create it now"
 iag_carrier.2.name:0 "LLM Construction Carrier: Enclave Created"
 iag_carrier.2.desc:0 "The dedicated construction carrier enclave has been created. §HTrantor§! and §HTerminus§! in the §HGrey Wind§! system are protected against housing, amenities, stability, crime, and upkeep problems.\n\nKeep the building selection panel open on Trantor and the primary-district or zone-specialization panel open on Terminus. The external executor selects the matching carrier click and rewrites it into the real target construction order."
 iag_carrier.ok:0 "Confirm"
 iag_carrier.10.name:0 "The Fourth Wall"
 iag_carrier.10.desc:0 "As our fleet attempts to enter this region, it encounters resistance from an unknown force.\nAn invisible \"wall\" stands between us and the target system.\nAfter exhausting every technical method currently available to us, the fleet's scientists volunteer to observe the \"wall\" at close range. The \"wall\" appears to respond to their observation. It begins to flash, as if transmitting a message. After decryption, our scientists recover the approximate meaning of the signal.\n\"Come back and explore the area ahead later~\""
 iag_carrier.10.a:0 "Explore it later"
 NAME_IAG_Carrier_Enclave_System:0 "Grey Wind"
 NAME_IAG_Carrier_Enclave:0 "Trantor"
 NAME_IAG_Carrier_Zone_Enclave:0 "Terminus"
 iag_carrier_enclave_planet:0 "LLM Carrier Enclave Protection"
 iag_carrier_enclave_planet_desc:0 "This colony exists only as a construction command carrier and does not perform ordinary economic or domestic planning."
