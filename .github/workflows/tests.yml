name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -r tools/agent_runtime/requirements-test.txt
      - run: python -m unittest discover -s tools/agent_runtime/tests -v
